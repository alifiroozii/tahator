  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="254" rx="145" ry="15" fill="#000" opacity="0.12"/>
        <path d="M52 216 L66 184 L118 144 L248 144 L298 182 L344 192 C352 200 350 225 335 230 L64 230 C52 228 48 222 52 216 Z" fill="#f8fafc" stroke="#27272a" stroke-width="3.5"/>
        <path d="M124 152 L240 152 L280 180 L108 180 Z" fill="#e2e8f0" stroke="#27272a" stroke-width="2"/>
        <circle cx="115" cy="230" r="27" fill="#27272a" stroke="#ffffff" stroke-width="3"/>
