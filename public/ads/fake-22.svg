<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-22" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-22)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <path d="M20 272 Q110 256 200 272 T380 272 L380 302 L20 302 Z" fill="#06b6d4" opacity="0.25"/>
        <path d="M20 282 Q110 266 200 282 T380 282 L380 308 L20 308 Z" fill="#0ea5e9" opacity="0.35"/>
        <rect x="95" y="135" width="210" height="128" rx="8" fill="#ffffff" stroke="#164e63" stroke-width="3"/>
        <polygon points="80,135 200,82 320,135" fill="#a62626" stroke="#164e63" stroke-width="3"/>
        <rect x="120" y="160" width="160" height="60" rx="6" fill="#e0f2fe" stroke="#164e63" stroke-width="2"/>
        <circle cx="315" cy="100" r="20" fill="#f59e0b" opacity="0.85"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#164e63" font-family="Tahoma, Vazirmatn, sans-serif">ویلا ساحلی چابکسر</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">چشم‌انداز مستقیم دریا</text>
</svg>