<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-5)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <rect x="78" y="108" width="244" height="170" rx="6" fill="#fffbeb" stroke="#292524" stroke-width="3" stroke-dasharray="10 6"/>
        <polygon points="120,178 200,126 280,178" fill="#a62626" opacity="0.88" stroke="#292524" stroke-width="2.5"/>
        <rect x="135" y="178" width="130" height="82" fill="#ffffff" stroke="#292524" stroke-width="2.5"/>
        <rect x="184" y="208" width="32" height="52" fill="#292524"/>
        <line x1="78" y1="92" x2="322" y2="92" stroke="#a62626" stroke-width="2.5"/>
        <circle cx="78" cy="92" r="4" fill="#a62626"/>
        <circle cx="322" cy="92" r="4" fill="#a62626"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#292524" font-family="Tahoma, Vazirmatn, sans-serif">کلنگی دوکله هوانیروز</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۲۰۸ متر · بر ۱۰ متر</text>
</svg>