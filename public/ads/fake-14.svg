<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-14)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <rect x="55" y="195" width="290" height="90" rx="18" fill="#bbf7d0"/>
        <circle cx="115" cy="155" r="40" fill="#16a34a" stroke="#064e3b" stroke-width="2.5"/>
        <rect x="111" y="185" width="8" height="45" fill="#78350f"/>
        <circle cx="285" cy="150" r="44" fill="#15803d" stroke="#064e3b" stroke-width="2.5"/>
        <rect x="281" y="184" width="8" height="48" fill="#78350f"/>
        <polygon points="160,185 200,145 240,185" fill="#a62626" stroke="#064e3b" stroke-width="2.5"/>
        <rect x="170" y="185" width="60" height="52" fill="#ffffff" stroke="#064e3b" stroke-width="2.5"/>
        <rect x="190" y="205" width="20" height="32" fill="#a62626"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#064e3b" font-family="Tahoma, Vazirmatn, sans-serif">باغ ۲۰۰۰ متری حومه تهران</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">فاصله ۱ ساعته از تهران</text>
</svg>