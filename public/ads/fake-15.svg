<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-15)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <polygon points="65,245 140,130 335,145 290,268" fill="#dcfce7" stroke="#a62626" stroke-width="3.5" stroke-dasharray="9 5"/>
        <circle cx="65" cy="245" r="7" fill="#a62626"/>
        <circle cx="140" cy="130" r="7" fill="#a62626"/>
        <circle cx="335" cy="145" r="7" fill="#a62626"/>
        <circle cx="290" cy="268" r="7" fill="#a62626"/>
        <path d="M125 200 L265 200 M195 152 L195 245" stroke="#134e4a" stroke-width="1.5" opacity="0.45"/>
        <rect x="160" y="176" width="76" height="36" rx="6" fill="#ffffff" stroke="#a62626" stroke-width="2"/>
        <text x="198" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#a62626" font-family="Tahoma, sans-serif">زمین مسکونی</text>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#134e4a" font-family="Tahoma, Vazirmatn, sans-serif">زمین مسکونی چالوس</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۲۲۲ متر دونبش مسکونی</text>
</svg>