<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-23" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-23)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="254" rx="135" ry="15" fill="#000" opacity="0.12"/>
        <path d="M70 218 L86 155 C95 136 125 132 165 132 L228 132 C260 132 288 152 318 184 L334 205 C338 218 332 228 318 230 L82 230 C68 228 66 224 70 218 Z" fill="#ffffff" stroke="#1f2937" stroke-width="3.5"/>
        <rect x="135" y="128" width="85" height="8" rx="4" fill="#1f2937"/>
        <path d="M104 176 L118 144 L245 144 L286 176 Z" fill="#334155" opacity="0.85"/>
        <circle cx="122" cy="230" r="26" fill="#1f2937" stroke="#ffffff" stroke-width="3"/>
        <circle cx="122" cy="230" r="12" fill="#a62626"/>
        <circle cx="276" cy="230" r="26" fill="#1f2937" stroke="#ffffff" stroke-width="3"/>
        <circle cx="276" cy="230" r="12" fill="#a62626"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#1f2937" font-family="Tahoma, Vazirmatn, sans-serif">پژو ۲۰۷ پانا اتومات</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">مدل ۱۴۰۴ · در حد صفر</text>
</svg>