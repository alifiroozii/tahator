<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-20)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="288" rx="145" ry="15" fill="#000" opacity="0.08"/>
        <polygon points="65,165 200,90 335,165" fill="#a62626" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round"/>
        <rect x="85" y="165" width="230" height="115" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
        <rect x="175" y="205" width="50" height="75" rx="3" fill="#1e3a8a"/>
        <rect x="105" y="188" width="48" height="46" rx="4" fill="#bae6fd" stroke="#1e3a8a" stroke-width="2"/>
        <rect x="247" y="188" width="48" height="46" rx="4" fill="#bae6fd" stroke="#1e3a8a" stroke-width="2"/>
        <rect x="105" y="282" width="190" height="14" rx="7" fill="#2563eb" opacity="0.8"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#1e3a8a" font-family="Tahoma, Vazirmatn, sans-serif">ویلا استخردار نمک‌آبرود</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۳ خوابه کلید اول استخردار</text>
</svg>