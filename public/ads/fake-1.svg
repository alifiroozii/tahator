<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-1)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="285" rx="145" ry="16" fill="#000" opacity="0.08"/>
        <rect x="75" y="105" width="250" height="170" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
        <rect x="75" y="105" width="250" height="22" rx="4" fill="#a62626"/>
        <rect x="92" y="140" width="90" height="48" rx="4" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
        <rect x="200" y="140" width="108" height="48" rx="4" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
        <rect x="92" y="205" width="128" height="70" rx="4" fill="#eff6ff" stroke="#1e293b" stroke-width="2"/>
        <rect x="240" y="205" width="60" height="70" rx="4" fill="#a62626" opacity="0.9"/>
        <rect x="85" y="278" width="230" height="18" rx="6" fill="#0ea5e9" opacity="0.85"/>
        <circle cx="52" cy="245" r="24" fill="#16a34a" opacity="0.85"/>
        <rect x="49" y="255" width="6" height="26" fill="#78350f"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#1e293b" font-family="Tahoma, Vazirmatn, sans-serif">ویلا تریبلکس ونوش</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۷۰۰ متر · ۶ خواب مستر</text>
</svg>