<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fae7e7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-7)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="290" rx="135" ry="14" fill="#000" opacity="0.09"/>
        <rect x="88" y="128" width="84" height="156" rx="4" fill="#f8fafc" stroke="#2a2a30" stroke-width="2.5"/>
        <rect x="150" y="80" width="110" height="204" rx="6" fill="#ffffff" stroke="#2a2a30" stroke-width="3"/>
        <rect x="150" y="80" width="110" height="16" rx="4" fill="#a62626"/>
        
          <rect x="168" y="112" width="30" height="22" rx="2" fill="#cbd5e1" stroke="#2a2a30" stroke-width="1.2"/>
          <rect x="212" y="112" width="30" height="22" rx="2" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.2"/>
        
          <rect x="168" y="146" width="30" height="22" rx="2" fill="#cbd5e1" stroke="#2a2a30" stroke-width="1.2"/>
          <rect x="212" y="146" width="30" height="22" rx="2" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.2"/>
        
          <rect x="168" y="180" width="30" height="22" rx="2" fill="#cbd5e1" stroke="#2a2a30" stroke-width="1.2"/>
          <rect x="212" y="180" width="30" height="22" rx="2" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.2"/>
        
          <rect x="168" y="214" width="30" height="22" rx="2" fill="#cbd5e1" stroke="#2a2a30" stroke-width="1.2"/>
          <rect x="212" y="214" width="30" height="22" rx="2" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.2"/>
        
        <rect x="185" y="246" width="40" height="38" rx="3" fill="#a62626"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#2a2a30" font-family="Tahoma, Vazirmatn, sans-serif">آپارتمان کوی بهاران شیراز</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۱۸۱ متری · ۳ خواب نوساز</text>
</svg>