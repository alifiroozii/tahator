<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-24)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="288" rx="135" ry="15" fill="#000" opacity="0.09"/>
        <polygon points="85,112 200,76 315,112" fill="#f8fafc" stroke="#2a2a30" stroke-width="3"/>
        <rect x="96" y="112" width="208" height="172" fill="#ffffff" stroke="#2a2a30" stroke-width="3"/>
        <rect x="112" y="120" width="16" height="154" fill="#f1f5f9" stroke="#2a2a30" stroke-width="2"/>
        <rect x="272" y="120" width="16" height="154" fill="#f1f5f9" stroke="#2a2a30" stroke-width="2"/>
        <path d="M168 284 L168 228 A32 32 0 0 1 232 228 L232 284 Z" fill="#a62626"/>
        <rect x="150" y="138" width="100" height="54" rx="26" fill="#fef3c7" stroke="#2a2a30" stroke-width="2"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#2a2a30" font-family="Tahoma, Vazirmatn, sans-serif">آپارتمان کلاسیک قیطریه</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">تک واحدی کلاسیک لوکس</text>
</svg>