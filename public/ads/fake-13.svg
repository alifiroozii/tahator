<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fed7d7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-13)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <rect x="85" y="102" width="230" height="175" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="3"/>
        <line x1="85" y1="185" x2="210" y2="185" stroke="#2d3748" stroke-width="3"/>
        <line x1="210" y1="102" x2="210" y2="220" stroke="#2d3748" stroke-width="3"/>
        <rect x="104" y="120" width="84" height="48" rx="4" fill="#fae7e7" stroke="#a62626" stroke-width="2"/>
        <rect x="228" y="120" width="68" height="62" rx="4" fill="#f4f4f5" stroke="#2d3748" stroke-width="1.5"/>
        <rect x="115" y="208" width="150" height="46" rx="6" fill="#fef2f2" stroke="#a62626" stroke-width="2"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#2d3748" font-family="Tahoma, Vazirmatn, sans-serif">سوئیت فرمانیه</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۴۰ متری · مدرن و دنج</text>
</svg>