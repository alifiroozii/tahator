<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fae7e7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-2)"/>
  <circle cx="345" cy="58" r="78" fill="#a62626" opacity="0.06"/>
  <circle cx="48" cy="335" r="90" fill="#a62626" opacity="0.05"/>

  <!-- Top-Center Badge (avoids PostCard top-left photo count and top-right pills) -->
  <rect x="122" y="16" width="156" height="28" rx="14" fill="#a62626"/>
  <text x="200" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif">تصویر نمایشی (فیک)</text>

  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="288" rx="125" ry="14" fill="#000" opacity="0.08"/>
        <rect x="110" y="88" width="180" height="196" rx="6" fill="#ffffff" stroke="#2a2a30" stroke-width="3"/>
        <rect x="110" y="88" width="180" height="18" rx="4" fill="#a62626"/>
        
          <rect x="130" y="122" width="38" height="26" rx="3" fill="#e2e8f0" stroke="#2a2a30" stroke-width="1.5"/>
          <rect x="181" y="122" width="38" height="26" rx="3" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.5"/>
          <rect x="232" y="122" width="38" height="26" rx="3" fill="#e2e8f0" stroke="#2a2a30" stroke-width="1.5"/>
        
          <rect x="130" y="162" width="38" height="26" rx="3" fill="#e2e8f0" stroke="#2a2a30" stroke-width="1.5"/>
          <rect x="181" y="162" width="38" height="26" rx="3" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.5"/>
          <rect x="232" y="162" width="38" height="26" rx="3" fill="#e2e8f0" stroke="#2a2a30" stroke-width="1.5"/>
        
          <rect x="130" y="202" width="38" height="26" rx="3" fill="#e2e8f0" stroke="#2a2a30" stroke-width="1.5"/>
          <rect x="181" y="202" width="38" height="26" rx="3" fill="#dbeafe" stroke="#2a2a30" stroke-width="1.5"/>
          <rect x="232" y="202" width="38" height="26" rx="3" fill="#e2e8f0" stroke="#2a2a30" stroke-width="1.5"/>
        
        <rect x="176" y="242" width="48" height="42" rx="4" fill="#a62626"/>
      
  </g>

  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#2a2a30" font-family="Tahoma, Vazirmatn, sans-serif">آپارتمان ستارخان</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">۵۰ متر · معاوضه با خودرو</text>
</svg>