  <!-- Caption Bar positioned cleanly above bottom-right PostCard pill -->
  <rect x="20" y="294" width="360" height="60" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#e4e4e7"/>
  <text x="200" y="319" text-anchor="middle" direction="rtl" font-size="14" font-weight="bold" fill="#0f172a" font-family="Tahoma, Vazirmatn, sans-serif">هیوندای توسان ۲۰۱۷</text>
  <text x="200" y="341" text-anchor="middle" direction="rtl" font-size="12" fill="#71717a" font-family="Tahoma, Vazirmatn, sans-serif">تک رادار فول وارداتی</text>
