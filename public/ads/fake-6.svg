  <!-- Center Vector Artwork -->
  <g transform="translate(0, -14)">
    
        <ellipse cx="200" cy="258" rx="145" ry="16" fill="#000" opacity="0.12"/>
        <path d="M58 212 L75 162 C85 138 115 126 155 126 L245 126 C282 126 308 145 322 172 L344 195 C350 205 348 228 332 232 L68 232 C54 230 52 222 58 212 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3.5"/>
        <path d="M105 165 L125 136 L202 136 L202 165 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
        <path d="M212 136 L262 136 L296 165 L212 165 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
        <circle cx="118" cy="234" r="30" fill="#0f172a" stroke="#ffffff" stroke-width="3"/>
        <circle cx="118" cy="234" r="14" fill="#94a3b8"/>
        <circle cx="285" cy="234" r="30" fill="#0f172a" stroke="#ffffff" stroke-width="3"/>
        <circle cx="285" cy="234" r="14" fill="#94a3b8"/>
        <rect x="64" y="196" width="16" height="10" rx="3" fill="#a62626"/>
        <rect x="322" y="196" width="18" height="10" rx="3" fill="#f59e0b"/>
      
