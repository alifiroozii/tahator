        <ellipse cx="200" cy="255" rx="148" ry="15" fill="#000" opacity="0.12"/>
        <path d="M50 218 L72 182 L130 144 C150 132 225 132 252 146 L305 182 L346 196 C354 205 352 225 335 230 L64 230 C50 228 46 224 50 218 Z" fill="#e4e4e7" stroke="#18181b" stroke-width="3.5"/>
